name: Morning Brief

on:
  push:
    branches: [main]
    paths:
      - "morning_brief.py"
      - "data/weekly_events.json"
      - "tests/**"
      - ".github/workflows/morning-brief.yml"
  # GitHub cron is UTC-only. Website refreshes are deliberately redundant
  # because scheduled runs are best-effort and may start late. Notification
  # slots remain gated in America/New_York by morning_brief.py --scheduled.
  schedule:
    # Weekdays: target 15-minute refreshes during market-active UTC hours,
    # hourly overnight. Weekends: target 30-minute refreshes around the clock.
    - cron: "7,22,37,52 0,8-23 * * 1-5"
    - cron: "17 1-7 * * 1-5"
    - cron: "7,37 * * * 0,6"
    # DST-safe weekday phone-notification candidates.
    - cron: "10 13 * * 1-5"
    - cron: "10 14 * * 1-5"
    - cron: "45 20 * * 1-5"
    - cron: "45 21 * * 1-5"
  # Run on demand from the Actions tab
  workflow_dispatch:

# Allow the workflow to push commits back to the repo
permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate morning brief
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          NTFY_NEWS_TOPIC: ${{ secrets.NTFY_NEWS_TOPIC }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_EXPRESSION" in
              "10 13 * * 1-5"|"10 14 * * 1-5"|"45 20 * * 1-5"|"45 21 * * 1-5")
                python morning_brief.py --scheduled
                ;;
              *)
                python morning_brief.py --web-refresh --no-push
                ;;
            esac
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python morning_brief.py --no-push
          else
            python morning_brief.py
          fi

      - name: Commit updated brief
        if: ${{ always() }}
        run: |
          git config user.name  "morning-brief-bot"
          git config user.email "morning-brief-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Brief: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
