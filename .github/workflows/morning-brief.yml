name: Morning Brief

on:
  # GitHub cron is UTC-only. Each ET slot has an EDT and EST candidate;
  # morning_brief.py --scheduled accepts only the invocation inside the local
  # 09:00 or 16:45 ET window, so the duplicate exits without side effects.
  schedule:
    - cron: "10 13 * * 1-5"
    - cron: "10 14 * * 1-5"
    - cron: "45 20 * * 1-5"
    - cron: "45 21 * * 1-5"
  # Run on demand from the Actions tab
  workflow_dispatch:

# Allow the workflow to push commits back to the repo
permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate morning brief
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          NTFY_NEWS_TOPIC: ${{ secrets.NTFY_NEWS_TOPIC }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python morning_brief.py --scheduled
          else
            python morning_brief.py
          fi

      - name: Commit updated brief
        if: ${{ always() }}
        run: |
          git config user.name  "morning-brief-bot"
          git config user.email "morning-brief-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Brief: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
